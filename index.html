
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Galih — G Interactive</title>
	<style>
		:root{--bg:#0b0b0b;--red:#ff1f3a;--muted:#a6a6a6}
		*{box-sizing:border-box}
		html,body{height:100%;margin:0;background:radial-gradient( circle at 10% 10%, rgba(255,31,58,0.05), transparent 10%), var(--bg);color:#fff;font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial}
		.container{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
		.card{width:100%;max-width:980px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);border:1px solid rgba(255,255,255,0.04);padding:36px;border-radius:16px;position:relative;overflow:hidden}
		.glow{position:absolute;right:-120px;top:-80px;width:420px;height:420px;background:conic-gradient(from 120deg,var(--red),#ff6b6b,rgba(255,255,255,0));filter:blur(60px);opacity:.28;transform:rotate(25deg)}
		.row{display:flex;gap:28px;align-items:center}
		.avatar{width:140px;height:140px;border-radius:20px;flex:0 0 140px;background:linear-gradient(135deg,#222,#111);display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,0.04);position:relative;overflow:hidden}
		.avatar::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,31,58,0.06));mix-blend-mode:screen}
		.initials{font-size:44px;font-weight:800;color:var(--red);letter-spacing:1px}
		h1{margin:0;font-size:28px}
		.handle{color:var(--muted);margin-top:6px}
		.bio{margin-top:18px;color:#ddd;line-height:1.4}
		.cta{display:flex;gap:12px;margin-top:22px}
		.btn{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:10px 14px;border-radius:10px;color:#fff;cursor:pointer;display:inline-flex;gap:10px;align-items:center;transition:all .18s cubic-bezier(.2,.9,.2,1)}
		.btn.primary{background:linear-gradient(90deg,var(--red),#ff6b6b);box-shadow:0 8px 30px rgba(255,31,58,0.12);border:0}
		.btn:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,0.6)}
		.links{display:flex;gap:12px;margin-left:auto}
		.chip{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.02);font-size:13px}
		.marquee{margin-top:20px;color:var(--muted);overflow:hidden;white-space:nowrap}
		.marquee > div{display:inline-block;padding-left:100%;animation:marq 12s linear infinite}
		@keyframes marq{to{transform:translateX(-100%)}}
		/* interactive sparkles */
		.sparkle{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;background:var(--red);mix-blend-mode:screen;opacity:0;transform:scale(0)}
		/* responsive */
		@media (max-width:640px){.row{flex-direction:column;align-items:flex-start}.avatar{width:112px;height:112px}.initials{font-size:34px}}
	</style>
</head>
<body>
	<div class="container">
		<div class="card" id="card">
			<div class="glow"></div>
			<div class="row">
				<div class="avatar" id="avatar">
					<div class="initials">G</div>
				</div>
				<div style="flex:1">
					<h1>Galih <span style="color:var(--muted);font-weight:600;font-size:16px">a.k.a G</span></h1>
					<div class="handle">Interactive Creator • UI/UX • Motion</div>
					<div class="bio">I design playful interfaces, micro-interactions and bold personal brands. Black & red aesthetic — follow for experiments and snippets.</div>
					<div class="cta">
						<button class="btn primary" id="follow">Follow</button>
						<button class="btn" id="contact">Contact</button>
						<div class="links">
							<div class="chip">Instagram</div>
							<div class="chip">Dribbble</div>
						</div>
					</div>
					<div class="marquee"><div>Latest — experimental UI demo • motion snippets • neon components • hover to spark</div></div>
				</div>
			</div>
			<!-- interactive sparkles container -->
		</div>
	</div>

	<script>
		// small interactive sparkle effect on hover/click
		const card = document.getElementById('card');
		function makeSparkle(x,y){
			const s = document.createElement('div');
			s.className='sparkle';
			document.body.appendChild(s);
			s.style.left = x - 5 + 'px';
			s.style.top = y - 5 + 'px';
			const size = 6 + Math.random()*18;
			s.style.width = s.style.height = size + 'px';
			s.style.background = Math.random()>0.5 ? 'radial-gradient(circle at 30% 30%, #fff, var(--red))' : 'var(--red)';
			requestAnimationFrame(()=>{s.style.opacity=1;s.style.transform='scale(1)';s.style.transition='all .6s ease-out';
				s.style.left = (x + (Math.random()-0.5)*120) + 'px';
				s.style.top = (y + (Math.random()-0.5)*120) + 'px';
				s.style.opacity=0;
			});
			setTimeout(()=>s.remove(),700);
		}

		card.addEventListener('mousemove', e=>{
			if(Math.random() < 0.25) makeSparkle(e.clientX,e.clientY);
		});
		card.addEventListener('click', e=>{
			for(let i=0;i<10;i++) makeSparkle(e.clientX + (Math.random()-0.5)*30, e.clientY + (Math.random()-0.5)*30);
		});

		// Follow button toggle
		const follow = document.getElementById('follow');
		follow.addEventListener('click', ()=>{
			if(follow.dataset.following === '1'){
				follow.textContent='Follow'; follow.dataset.following='0'; follow.classList.remove('following');
			} else { follow.textContent='Following'; follow.dataset.following='1'; follow.classList.add('following'); }
		});

		// small parallax pointer effect
		document.addEventListener('mousemove', e=>{
			const rx = (e.clientX - window.innerWidth/2)/40;
			const ry = (e.clientY - window.innerHeight/2)/40;
			card.style.transform = `translate3d(${rx}px,${ry}px,0)`;
		});
	</script>
</body>
</html>
