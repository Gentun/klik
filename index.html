<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galih - Personal Branding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

body {
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;

    /* Background gambar */
    background-image: url("iguy.gif");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}


        @keyframes float {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(calc(100vw + 200px));
            }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Photo section */
        .photo-container {
            margin-bottom: 30px;
            position: relative;
        }


.photo {
    width: 200px;
    height: 200px;

    border-radius: 50%;
    object-fit: cover;

    border: 4px solid #ffb36b;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.5),
        0 0 30px rgba(255, 130, 60, 0.45);

    margin: 0 auto;
    display: block;

    transition: all 0.3s ease;
    cursor: pointer;
}

.photo:hover {
    transform: scale(1.08);

    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.6),
        0 0 45px rgba(255, 140, 60, 0.7);
}



        .photo:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 20px 50px rgba(102, 126, 234, 0.6);
        }

        /* Glow effect around photo */
 
.glow-ring {
    position: absolute;

    width: 220px;
    height: 220px;

    border: 2px solid rgba(255, 170, 100, 0.65);

    border-radius: 50%;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    animation: spin 20s linear infinite;

    opacity: 0.7;

    pointer-events: none;
}


        @keyframes spin {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* Name styling */
        h1 {
            font-size: 48px;
            color: #ff9a5a;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .aka {
            font-size: 24px;
            color: #ff9a5a;
            font-weight: 600;
            margin-bottom: 20px;
            font-style: italic;
        }

        .tagline {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Interactive buttons */
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            border: 2px solid #ff9a5a;
            background: white;
            color: #ff9a5a;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(102, 126, 234, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:hover {
            background: #ff9a5a;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff9a5a 0%, #ff6b6b 100%);
            color: white;
            border: 2px solid transparent;
        }

        .btn-primary:hover {
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
            transform: translateY(-5px);
        }

        /* Social icons */
        .social {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
.social-icon img {
    width: 28px;
    height: 28px;
    object-fit: contain;
}

        }

        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(102, 126, 234, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 24px;
            text-decoration: none;
            color: #000000;
        }

        .social-icon:hover {
            background: #ff9a5a;
            color: white;
            transform: scale(1.2) rotate(10deg);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        /* Floating particles */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 1;
        }

        .particle-dot {
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: floatParticle 10s infinite ease-in-out;
        }

        @keyframes floatParticle {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-30px);
            }
        }
    </style>
</head>
<body>
    <!-- Cloud background -->
    <div class="clouds">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        <div class="cloud cloud4"></div>
    </div>

    <!-- Main container -->
    <div class="container">
        <!-- Photo with glow effect -->
     <div class="photo-container">
    <div class="glow-ring"></div>
    <img src="PPK.jpg" alt="Foto Galih" class="photo">
</div>

        <!-- Name -->
        <h1>GALIH</h1>
        <div class="aka">aka G</div>
        <p class="tagline">STUDENT | For testing purposes</p>

        <!-- Interactive buttons -->
        <div class="button-group">
            <button class="btn btn-primary">Follow</button>
            <button class="btn">Message</button>
            <button class="btn">Portfolio</button>
        </div>

        <!-- Social icons -->
        <div class="social">

<a href="https://www.instagram.com/lihhhbutttt/" class="social-icon" title="Instagram">
    <img src="dog.png" alt="Instagram">
</a>

       <a href="https://www.tiktok.com/@gbeamount_" class="social-icon" title="tiktok">
    <img src="tiktok.png" alt="TikTok">
</a>
<a href="#" class="social-icon" title="whatsapp">
    <img src="wa.png" alt="whatsapp">
</a>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particleCount = 20;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.innerHTML = '<div class="particle-dot"></div>';
                particle.style.left = Math.random() * window.innerWidth + 'px';
                particle.style.top = Math.random() * window.innerHeight + 'px';
                particle.style.animationDelay = Math.random() * 10 + 's';
                document.body.appendChild(particle);
            }
        }

        // Add interactive ripple effect on button click
        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const ripple = document.createElement('div');
                ripple.style.position = 'absolute';
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(255, 255, 255, 0.6)';
                ripple.style.width = '20px';
                ripple.style.height = '20px';
                ripple.style.left = (e.clientX - rect.left) + 'px';
                ripple.style.top = (e.clientY - rect.top) + 'px';
                ripple.style.pointerEvents = 'none';
                ripple.style.animation = 'ripple 0.6s ease-out';
                this.appendChild(ripple);
                
                setTimeout(() => ripple.remove(), 600);
            });
        });

        // Add ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Initialize particles on load
        window.addEventListener('load', createParticles);
        


const profilePhotos = [
    "PPK.jpg",
    "foto2.jpg",
    "foto3.jpg",
    "foto4.jpg"
];

let currentPhoto = 0;

setInterval(() => {
    currentPhoto++;

    if (currentPhoto >= profilePhotos.length) {
        currentPhoto = 0;
    }

    document.getElementById("profile-photo").src =
        profilePhotos[currentPhoto];

}, 1000);

    </script>
</body>
</html>
